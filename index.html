<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>CodeBrew - Cafetería online</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-warning">
            <div class="container-fluid">
                <a class="navbar-brand" href="main.html">
                    <img src="icon_CodeBrew-removebg-preview.png" alt="icon" width="50px">
                    CodeBrew
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <a class="nav-link active" aria-current="page" href="#inicio">
                            Inicio <i class="fa-solid fa-house"></i>
                        </a>

                        <a class="nav-link" href="#productos">
                            Productos <i class="fa-solid fa-mug-hot"></i>
                        </a>

                        <a class="nav-link" href="#ordenar">
                            Ordenar <i class="fa-solid fa-cart-shopping"></i>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>


    <main>
        <!-- Home -->
        <section id="inicio" class="container my-5 mb-6">
            <div class="row p-4 pb-0 pe-lg-0 pt-lg-5 align-items-center rounded-3 " id="hero">
                <div class="col-lg-7 p-3 p-lg-5 pt-lg-3">
                    <h1>
                    Comienza tu dia con un buen café
                    </h1>

                </div>
                <div class="col-lg-4 offset-lg-1 p-0 overflow-hidden shadow-lg" id="imagen_tasa">
                    <img class="rounded-lg-3" src="img/cafe_tapa.png" alt="taza_de_café" width="500">
                </div>
            </div>
        </section>

        <div id="prueba">

        </div>

        <!-- Productos -->
        <section id="productos" class="carrousel-container container pt-5">
            <h2>Nuestros Productos</h2>
            <div class="carrousel" id="carrousel">
                
            </div>
        </section>


        <!-- Ordenar -->
        <section id="ordenar" class="container my-5">
            <div class="mb-5 contenedor-orden rounded-3">

                <div id="visorPedidos" class="visorPedidos orden rounded-3 col-5" >
                    <p id="TextOtter" class="text-center">
                        Pide tu café para empezar el día, relajarse un momento, o simplemente disfrutar de la vida </br></br>
                        <i class="fa-solid fa-otter display-6"></i>
                    </p>
                    <div class="listaProductos d-none" id="listaProductos">
                        <table class="table table-bordered table-warning">
                            <thead>
                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">Cantidad</th>
                                    <th scope="col">Producto</th>
                                    <th scope="col">Precio</th>
                                    <th scope="col">SubTotal</th>
                                </tr>
                            </thead>
                            <tbody id="tablaDatos">
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="containerOrdenar orden rounded-3 p-3 col-5">
                    <label for="inputCafe">Escoja un sabor: </label>
                    <div>
                        <select id="inputCafe" class="form-select mt-2">
                            <option selected disabled>Seleccionar tipo</option>
                        </select>
                        <button id="buttonSelectCafe" onclick="agregar_al_carro()" class="btn btn-warning mt-5">Agregar pedido</button>
                    </div>
                </div>
            </div>
        </section>


    </main>

    <footer class="footer mt-auto bg-black py-3 bg-body-tertiary"> 
        <div class="container">
            <span class="text-body-secondary"> &copy; CodeBrew <i class="fa-solid fa-shrimp"></i></span> 
        </div> 
    </footer>


    <!-- Font Awesome para los iconos -->
    <script src="script.js" defer></script>
    <script src="https://kit.fontawesome.com/7ab8bcd99c.js" crossorigin="anonymous"></script>
</body>

</html>
